# Reusable Workflows see: https://github.com/entur/gha-security/blob/main/README-code-scan.md

name: CodeQL Scan

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  schedule:
    - cron: "0 2 * * MON" # Run Monday at 2AM UTC

jobs:
  code-scan:
    name: CodeQL Scan
    uses: entur/gha-security/.github/workflows/code-scan.yml@89ffce329b85b10d285defb50bb58c35227d4305 # v2.17.0
    # no secrets necessary
    permissions:
      packages: read
      security-events: write
      actions: read
      contents: write
      issues: write
      pull-requests: write
