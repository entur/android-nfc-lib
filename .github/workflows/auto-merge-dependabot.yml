name: Auto Merge Dependabot (Entur)
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  auto-merge:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'entur/android-nfc-lib'
    uses: entur/abt-gha-public/.github/workflows/auto-merge.yml@393bf5603dc3507c0fc84c3d3387bd529169058c # v2.0
    with:
      # Semver gate: patch and minor are auto-merged, major needs manual review.
      auto-merge-patch: true
      auto-merge-minor: true
      auto-merge-major: false
      # Ecosystem gate: only library/package dependencies (gradle) are auto-merged.
      # GitHub Actions and Docker updates are reviewed manually.
      auto-merge-dependencies: true
      auto-merge-docker: false
      auto-merge-github-actions: false
      # Slack failure notification is disabled: the reusable workflow skips it for
      # NO_ID, so no secrets are passed to it (no `secrets: inherit`).
      channel-id: NO_ID
    permissions:
      pull-requests: write
      contents: write
