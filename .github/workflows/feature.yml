name: Build libraries + example client
on:
    push:
        branches-ignore:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    build:
        runs-on:
            labels: ubuntu-latest
        timeout-minutes: 30
        # no secrets necessary
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Resolve safe Java version
              id: java
              uses: entur/abt-gha-public/.github/actions/safe-java-version@v2
              with:
                java-version: 21
                distribution: liberica
            - name: Set up JDK 21
              uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  java-version: ${{ steps.java.outputs.java-version }}
                  distribution: liberica
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            - name: Build
              run: |
                  ./gradlew build --info --stacktrace

